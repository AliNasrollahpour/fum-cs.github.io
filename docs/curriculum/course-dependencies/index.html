<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمودار پیش‌نیاز دروس | علوم کامپیوتر فردوسی مشهد</title>
<style>:root{--bg:#fafafa;--panel:#f5f5f5;--text:#303030;--muted:#777;--border:#ddd;--accent:#e05252;--grid:#e5e5e5;--edge:#999;--node:#555}
[data-theme="dark"]{--bg:#202020;--panel:#262626;--text:#dcddde;--muted:#999;--border:#3b3b3b;--accent:#e05252;--grid:#2b2b2b;--edge:#777;--node:#444}}
@media(prefers-color-scheme:dark){:root{--bg:#202020;--panel:#262626;--text:#dcddde;--muted:#999;--border:#3b3b3b;--accent:#e05252;--grid:#2b2b2b;--edge:#777;--node:#444}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 20px 11px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:22px;margin:0 0 4px}.sub,.small{color:var(--muted);font-size:13px}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls input,.controls select,.controls button{font:inherit;color:var(--text);border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:7px 9px}.controls input{width:220px}.controls .force{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}.controls .force input{width:100px}.controls .force span{width:28px;color:var(--text)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;height:calc(100vh - 88px);min-height:600px}
main{overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px}
svg{width:100%;height:100%;touch-action:none;cursor:grab}svg.dragging{cursor:grabbing}
.side{border-left:1px solid var(--border);background:var(--panel);padding:13px;overflow:auto}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}
.legend{margin:13px 0;display:grid;gap:7px;font-size:12px}.legend span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:-1px}
#details{border-top:1px solid var(--border);padding-top:11px;line-height:1.7}.notice{background:color-mix(in srgb,#e0a000 12%,var(--panel));border:1px solid #8b6f2b;border-radius:6px;padding:8px;margin:9px 0;font-size:12px}
ul{padding-right:20px}.node ellipse{stroke:var(--bg);stroke-width:2}.node text{pointer-events:none;fill:var(--text)}.title{font-size:11px;font-weight:600}.cat{font-size:9px;fill:var(--muted)!important}.edge{fill:none;stroke:var(--edge);stroke-width:1.2;opacity:.8}.edge.coreq{stroke-dasharray:5 5}.dim{opacity:.08}.selected ellipse{stroke:var(--accent);stroke-width:3}.match ellipse{stroke:var(--text);stroke-width:3}
@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}.side{border:0;border-top:1px solid var(--border);max-height:400px}.layout main{height:70vh;min-height:500px}}</style>
</head>
<body>
<header>
<div><h1>نمودار وابستگی دروس</h1><div class="sub">علوم کامپیوتر دانشگاه فردوسی مشهد — پیش‌نیازها و هم‌نیازها</div></div>
<div class="controls"><input id="search" placeholder="جستجوی درس…"><select id="category"><option value="all">همه دروس</option><option value="base">پایه</option><option value="mandatory">الزامی</option><option value="elective">اختیاری</option></select><label class="force">دفع گره‌ها <input id="repulsion" type="range" min="0" max="10" step="0.1" value="1"><span id="repulsionValue">1.0</span></label><label class="force">کشش یال‌ها <input id="spring" type="range" min="0" max="10" step="0.1" value="1"><span id="springValue">1.0</span></label><label class="force">چیدمان درختی <input id="tree" type="range" min="0" max="10" step="0.1" value="1"><span id="treeValue">1.0</span></label><button id="reset">نمایش همه</button></div>
</header>
<div class="layout">
<main><svg id="graph"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#777"/></marker></defs><g id="view"></g></svg></main>
<aside class="side">
<div class="stats"><div class="stat"><b id="count">—</b><span>درس</span></div><div class="stat"><b id="edges">—</b><span>رابطه</span></div><div class="stat"><b id="unresolved">—</b><span>ارجاع حل‌نشده</span></div><div class="stat"><b id="cycles">—</b><span>چرخه</span></div></div>
<div class="legend"><div><span style="background:#455a64"></span>دروس پایه</div><div><span style="background:#8e2b2b"></span>دروس الزامی</div><div><span style="background:#3949ab"></span>دروس اختیاری</div><div>خط پیوسته: پیش‌نیاز</div><div>خط‌چین: هم‌نیاز</div></div>
<div id="audit"></div><div id="details" class="small">یک گره را انتخاب کنید. دوبار کلیک صفحه درس را باز می‌کند.</div>
</aside>
</div>
<script>
var courses=[],rels=[],unresolved=[],selected=null,filter="all",query="",layout=null;var forces={repulsion:1,spring:1,tree:1};
var svg=document.getElementById("graph"),view=document.getElementById("view");
function norm(s){return(s||"").replace(/[\u200c\u200d]/g,"").replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[\u064B-\u065F]/g,"").replace(/\s+/g," ").trim()}
function cat(b){return b.indexOf("دروس پایه")>=0?"base":b.indexOf("دروس الزامی")>=0?"mandatory":"elective"}
function id(u){return decodeURIComponent(u.split("/").filter(Boolean).pop())}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]})}
function sitePath(p){var base=location.pathname.indexOf("/docs/")>=0?location.pathname.split("/docs/")[0]:"";return base+"/"+String(p||"").replace(/^\/+/,"")}
async function load(){
 var categories=[
  {path:"/docs/category/دروس-پایه/",category:"base"},
  {path:"/docs/category/دروس-الزامی/",category:"mandatory"},
  {path:"/docs/category/دروس-اختیاری/",category:"elective"}
 ];
 var pages=await Promise.all(categories.map(async function(group){
  var url=sitePath(group.path);
  var r=await fetch(url);
  if(!r.ok)throw new Error(url+" HTTP "+r.status);
  return {group:group,html:await r.text()};
 }));
 var seen={};
 courses=[];
 pages.forEach(function(page){
  var doc=new DOMParser().parseFromString(page.html,"text/html");
  [].slice.call(doc.querySelectorAll('a[href^="/docs/curriculum/"]')).forEach(function(a){
   var href=a.getAttribute("href");
   if(!href||href.indexOf("/docs/curriculum/")!==0||href.indexOf("/docs/curriculum/course-dependencies")===0)return;
   var key=href.replace(/\/$/,"");
   if(seen[key])return;
   seen[key]=1;
   var title=(a.getAttribute("title")||a.textContent||href.split("/").pop()).trim();
   courses.push({id:id(href),url:href,title:title,category:page.group.category,prereqs:[],coreqs:[],conditions:[]});
  });
 });
 if(!courses.length)throw new Error("No courses found in curriculum category pages");
 var map={};courses.forEach(function(c){map[norm(c.title)]=c;map[c.url.replace(/\/$/,"")]=c});
 buildLayout();render();
 document.getElementById("details").textContent="دروس بارگذاری شدند؛ در حال خواندن پیش‌نیازها…";
 unresolved=[];
 await Promise.all(courses.map(async function(c){
  try{
   var url=sitePath(c.url);
   var r=await fetch(url);
   if(!r.ok)throw new Error("HTTP "+r.status);
   var html=await r.text();
   var doc=new DOMParser().parseFromString(html,"text/html");
   var rows=[].slice.call(doc.querySelectorAll("tr"));
   var pre=rows.find(function(x){return norm(x.cells&&x.cells[0]&&x.cells[0].textContent).indexOf("پیشنیاز")===0});
   var co=rows.find(function(x){return norm(x.cells&&x.cells[0]&&x.cells[0].textContent).indexOf("همنیاز")===0});
   function parse(row,type){
    if(!row)return;
    var cell=row.cells&&row.cells[1];
    if(!cell)return;
    var raw=norm(cell.textContent);
    if(!raw||raw==="ندارد")return;
    var links=[].slice.call(cell.querySelectorAll("a[href^=\"/docs/curriculum/\"]"));
    if(links.length){
     links.forEach(function(a){
      var href=a.getAttribute("href").replace(/\/$/,"");
      var t=map[href]||map[norm(a.textContent)];
      if(t){if(type==="pre")c.prereqs.push(t.id);else c.coreqs.push(t.id)}
      else{c.conditions.push(a.textContent.trim());unresolved.push({course:c,ref:a.textContent.trim(),type:type})}
     });
     return;
    }
    raw.split(/[،,]/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){
     var t=map[norm(x)];
     if(t){if(type==="pre")c.prereqs.push(t.id);else c.coreqs.push(t.id)}
     else{c.conditions.push(x);unresolved.push({course:c,ref:x,type:type})}
    });
   }
   parse(pre,"pre");parse(co,"coreq");
  }catch(e){unresolved.push({course:c,ref:"صفحه درس قابل بارگذاری نیست: "+e.message,type:"load"})}
 }));
 rels=[];
 courses.forEach(function(c){
  c.prereqs.forEach(function(p){rels.push({s:p,t:c.id,type:"pre"})});
  c.coreqs.forEach(function(p){rels.push({s:p,t:c.id,type:"coreq"})});
 });
 buildLayout();render();audit();
}
function buildLayout(){
 var n=courses.length,pos={},vel={},depth={},adj={};
 if(!n){layout={pos:{},w:800,h:600};return}
 courses.forEach(function(c){adj[c.id]=[]});
 rels.filter(function(e){return e.type==="pre"}).forEach(function(e){adj[e.s].push(e.t)});
 function depthOf(id,seen){
  if(depth[id]!=null)return depth[id];
  if(seen[id])return 0;
  seen[id]=1;
  var next=adj[id]||[];
  var d=0;
  next.forEach(function(v){d=Math.max(d,depthOf(v,seen)+1)});
  delete seen[id];
  depth[id]=d;
  return d;
 }
 courses.forEach(function(c){depthOf(c.id,{})});
 var maxDepth=0;
 courses.forEach(function(c){maxDepth=Math.max(maxDepth,depth[c.id]||0)});
 var radius=Math.max(220,Math.sqrt(n)*42);
 courses.forEach(function(c,i){
  var a=i/n*Math.PI*2;
  pos[c.id]={x:80+Math.cos(a)*radius*.18,y:300+Math.sin(a)*radius};
  vel[c.id]={x:0,y:0};
 });
 for(var iter=0;iter<260;iter++){
  var force={};
  courses.forEach(function(c){force[c.id]={x:0,y:0}});
  for(var i=0;i<n;i++)for(var j=i+1;j<n;j++){
   var a=pos[courses[i].id],b=pos[courses[j].id];
   var dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2);
   if(d>180)continue;
   d2+=900;d=Math.sqrt(d2);
   var f=forces.repulsion*Math.min(1.2,4500/d2);
   force[courses[i].id].x+=dx/d*f;force[courses[i].id].y+=dy/d*f;
   force[courses[j].id].x-=dx/d*f;force[courses[j].id].y-=dy/d*f;
  }
  rels.forEach(function(e){
   var a=pos[e.s],b=pos[e.t];if(!a||!b)return;
   var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+1;
   var f=forces.spring*Math.max(-3.5,Math.min(3.5,(d-150)*0.012));
   force[e.s].x+=dx/d*f;force[e.s].y+=dy/d*f;
   force[e.t].x-=dx/d*f;force[e.t].y-=dy/d*f;
  });
  courses.forEach(function(c){
   var p=pos[c.id],f=force[c.id];
   var targetY=80+(maxDepth-(depth[c.id]||0))*150;
   f.y+=(targetY-p.y)*0.035*forces.tree;
   f.x+=(80-p.x)*0.002;
   vel[c.id].x=(vel[c.id].x+f.x)*0.82;
   vel[c.id].y=(vel[c.id].y+f.y)*0.82;
   vel[c.id].x=Math.max(-14,Math.min(14,vel[c.id].x));
   vel[c.id].y=Math.max(-10,Math.min(10,vel[c.id].y));
   p.x+=vel[c.id].x;p.y+=vel[c.id].y;
  });
 }
 var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
 courses.forEach(function(c){var p=pos[c.id];minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)});
 courses.forEach(function(c){pos[c.id]={x:pos[c.id].x-minX+80,y:pos[c.id].y-minY+80}});
 layout={pos:pos,w:Math.max(800,maxX-minX+160),h:Math.max(600,maxY-minY+160),depth:depth,maxDepth:maxDepth};
}
function edgePath(a,b){
 var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,r=10;
 var ux=dx/d,uy=dy/d,sx=a.x+ux*r,sy=a.y+uy*r,tx=b.x-ux*r,ty=b.y-uy*r;
 var bend=Math.min(45,Math.max(0,(d-220)*.12)),nx=-uy*bend,ny=ux*bend;
 return "M "+sx+" "+sy+" C "+(sx+dx*.35+nx)+" "+(sy+dy*.35+ny)+" "+(tx-dx*.35+nx)+" "+(ty-dy*.35+ny)+" "+tx+" "+ty;
}
function render(){
 view.innerHTML="";
 svg.setAttribute("viewBox","0 0 "+layout.w+" "+layout.h);
 var by={};courses.forEach(function(c){by[c.id]=c});
 rels.forEach(function(e){
  var a=layout.pos[e.s],b=layout.pos[e.t];if(!a||!b)return;
  var p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",edgePath(a,b));p.setAttribute("class","edge"+(e.type==="coreq"?" coreq":""));
  p.setAttribute("marker-end","url(#arrow)");
  if(selected&&e.s!==selected&&e.t!==selected)p.classList.add("dim");
  view.appendChild(p);
 });
 courses.forEach(function(c){
  var p=layout.pos[c.id],n=document.createElementNS("http://www.w3.org/2000/svg","g");
  n.setAttribute("transform","translate("+p.x+" "+p.y+")");n.setAttribute("class","node");
  var visible=filter==="all"||filter===c.category,match=!query||norm(c.title).indexOf(norm(query))>=0;
  if(!visible||!match||(selected&&c.id!==selected&&!rels.some(function(e){return(e.s===selected&&e.t===c.id)||(e.t===selected&&e.s===c.id)})))n.classList.add("dim");
  if(selected===c.id)n.classList.add("selected");if(query&&match)n.classList.add("match");
  var r=document.createElementNS("http://www.w3.org/2000/svg","ellipse");r.setAttribute("rx",Math.max(48,c.title.length*4.2+18));r.setAttribute("ry",22);r.setAttribute("fill",c.category==="base"?"#455a64":c.category==="mandatory"?"#8e2b2b":"#3949ab");n.appendChild(r);
  var t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",0);t.setAttribute("y",4);t.setAttribute("text-anchor","middle");t.setAttribute("fill","#fff");t.setAttribute("class","title");t.textContent=c.title;n.appendChild(t);
  n.onpointerdown=function(e){
 nodePointerDown(c,e);
};
n.onclick=function(e){
 if(e.detail>1)return;
 selected=c.id;details(c);render();
};
n.ondblclick=function(){location.href=sitePath(c.url)};
view.appendChild(n)
 });
 document.getElementById("count").textContent=courses.length;document.getElementById("edges").textContent=rels.length;document.getElementById("unresolved").textContent=unresolved.length;document.getElementById("cycles").textContent=cycles();
}
function cycles(){
 var state={},adj={};courses.forEach(function(c){state[c.id]=0;adj[c.id]=[]});rels.filter(function(e){return e.type==="pre"}).forEach(function(e){adj[e.s].push(e.t)});var n=0;
 function dfs(v){if(state[v]===1){n++;return}if(state[v]===2)return;state[v]=1;adj[v].forEach(dfs);state[v]=2}courses.forEach(function(c){if(!state[c.id])dfs(c.id)});return n;
}
function details(c){
 var by={};courses.forEach(function(x){by[x.id]=x});
 function list(a){return a.length?"<ul>"+a.map(function(x){return"<li>"+esc(by[x].title)+"</li>"}).join("")+"</ul>":"<div>ندارد</div>"}
 var extra=c.conditions.length?'<div class="notice"><b>ارجاع خارج از گراف</b><ul>'+c.conditions.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ul></div>":"";
 document.getElementById("details").innerHTML="<b>"+esc(c.title)+"</b><div>پیش‌نیازها:</div>"+list(c.prereqs)+"<div>هم‌نیازها:</div>"+list(c.coreqs)+extra+'<a href="'+sitePath(c.url)+'" style="color:#c62828">صفحه درس</a>';
}
function audit(){
 var a=document.getElementById("audit");a.innerHTML=unresolved.length?"<div class='notice'><b>"+unresolved.length+" مورد خارج از گراف</b><ul>"+unresolved.map(function(x){return"<li>"+esc(x.course.title)+": "+esc(x.ref)+"</li>"}).join("")+"</ul></div>":"<div class='small'>همه ارجاعات به دروس موجود متصل شدند.</div>";
}
function forceControl(id,key){var el=document.getElementById(id),out=document.getElementById(id+"Value");el.oninput=function(){forces[key]=Number(el.value);out.textContent=Number(el.value).toFixed(1);startSimulation()}}
forceControl("repulsion","repulsion");forceControl("spring","spring");forceControl("tree","tree");
document.getElementById("search").oninput=function(e){query=e.target.value;render()};
document.getElementById("category").onchange=function(e){filter=e.target.value;render()};
document.getElementById("reset").onclick=function(){query="";filter="all";selected=null;document.getElementById("search").value="";document.getElementById("category").value="all";document.getElementById("details").textContent="یک گره را انتخاب کنید. دوبار کلیک صفحه درس را باز می‌کند.";render()};
var scale=1,tx=0,ty=0,drag=false,last,dragNode=null,simTimer=null;
function transform(){view.setAttribute("transform","translate("+tx+" "+ty+") scale("+scale+")")}
function svgPoint(e){
 var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
 var m=svg.getScreenCTM();if(m)return p.matrixTransform(m.inverse());
 return {x:e.clientX,y:e.clientY};
}
function startSimulation(){
 if(simTimer)return;
 simTimer=requestAnimationFrame(simulate);
}
function simulate(){
 simTimer=null;
 if(!courses.length||!layout)return;
 var force={};
 courses.forEach(function(c){force[c.id]={x:0,y:0}});
 for(var i=0;i<courses.length;i++)for(var j=i+1;j<courses.length;j++){
  var a=layout.pos[courses[i].id],b=layout.pos[courses[j].id];
  var dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2);
  if(d>180)continue;
  d2+=900;d=Math.sqrt(d2);
  var f=forces.repulsion*Math.min(1.2,4500/d2);
  force[courses[i].id].x+=dx/d*f;force[courses[i].id].y+=dy/d*f;
  force[courses[j].id].x-=dx/d*f;force[courses[j].id].y-=dy/d*f;
 }
 rels.forEach(function(e){
  var a=layout.pos[e.s],b=layout.pos[e.t];if(!a||!b)return;
  var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+1;
  var f=forces.spring*Math.max(-3.5,Math.min(3.5,(d-150)*0.012));
  force[e.s].x+=dx/d*f;force[e.s].y+=dy/d*f;
  force[e.t].x-=dx/d*f;force[e.t].y-=dy/d*f;
 });
 var moving=false;
 courses.forEach(function(c){
  if(c.id===dragNode)return;
  var p=layout.pos[c.id],f=force[c.id];
  var targetY=80+(layout.maxDepth-(layout.depth[c.id]||0))*150;
  f.y+=(targetY-p.y)*0.035*forces.tree;
  f.x+=(80-p.x)*0.002;
  p.x+=f.x;p.y+=f.y;
  if(Math.abs(f.x)+Math.abs(f.y)>.18)moving=true;
 });
 if(moving||dragNode)render();
 if(moving||dragNode)simTimer=requestAnimationFrame(simulate);
}
function nodePointerDown(c,e){
 e.stopPropagation();
 selected=c.id;
 details(c);
 render();
 dragNode=c.id;drag=true;
 last=svgPoint(e);
 svg.classList.add("dragging");
 if(svg.setPointerCapture)svg.setPointerCapture(e.pointerId);
 startSimulation();
}
svg.onwheel=function(e){e.preventDefault();scale=Math.max(.45,Math.min(2.2,scale*(e.deltaY<0?1.08:.925)));transform()};
svg.onpointerdown=function(e){if(e.target.closest(".node"))return;drag=true;dragNode=null;last={x:e.clientX,y:e.clientY};svg.classList.add("dragging")};
window.onpointermove=function(e){
 if(!drag)return;
 if(dragNode){
  var p=svgPoint(e),q=layout.pos[dragNode];
  q.x=p.x;q.y=p.y;render();startSimulation();
 }else{
  tx+=e.clientX-last.x;ty+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};transform();
 }
};
window.onpointerup=function(e){
 var wasNode=!!dragNode;
 drag=false;dragNode=null;svg.classList.remove("dragging");
 if(wasNode&&svg.releasePointerCapture)try{svg.releasePointerCapture(e.pointerId)}catch(_){}
};
load().catch(function(e){document.getElementById("details").textContent="خطا در بارگذاری: "+e.message});

</script></body></html>
